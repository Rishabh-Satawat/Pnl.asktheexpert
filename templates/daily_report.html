<!-- Legacy report design scaffold. DailyReportGenerator currently assembles the
     active HTML directly; keep this scaffold aligned until it is wired in. -->
<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <title>Daily P&amp;L Report - <!-- REPORT_DATE_PLACEHOLDER --></title>
  <style>
    /* Keep CSS self-contained: PDF generation must not depend on web fonts. */
    html, body { margin: 0; padding: 0; background: #0B1426; color: #E2E8F0; font-family: 'Noto Sans', 'Segoe UI', Arial, sans-serif; }
    .currency-symbol { font-family: 'Noto Sans', 'Segoe UI Symbol', sans-serif; }
    .page { padding: 18mm 14mm; }
    .report-section { margin-bottom: 24px; page-break-inside: avoid; }
    .benchmark-ribbon { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .analytics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .embedded-chart { display: block; width: 100%; max-height: 280px; object-fit: contain; }
    .table-scroll { overflow-x: auto; }
    .disclaimer-footer { font-size: 10px; font-weight: 700; opacity: 0.85; border-top: 1px solid #1E3A5F; padding-top: 10px; margin-top: 24px; }
    @media print {
      html, body { background: #fff !important; color: #111827 !important; print-color-adjust: exact; }
      .page { padding: 0; }
      h1, h2, h3 { color: #111827 !important; }
      .strategy-card { page-break-inside: avoid; break-inside: avoid; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- SECTION 1: HEADER & KPI STRIP (6 tiles) -->
  <section id="section-header-kpi" class="report-section">
    <div id="header-title">
      <h1><!-- DESK_NAME --></h1>
      <div class="sub">Daily Founder P&amp;L Report — <span id="report-date"><!-- REPORT_DATE_PLACEHOLDER --></span></div>
    </div>
    <div id="kpi-strip" class="kpi-tiles-grid">
      <!-- KPI_TILE_CAPITAL_DEPLOYED -->
      <!-- KPI_TILE_TOTAL_GROSS_PNL -->
      <!-- KPI_TILE_TOTAL_CHARGES -->
      <!-- KPI_TILE_TOTAL_NET_PNL -->

      <!-- KPI_TILE_NET_ROI -->
    </div>
    <h2>Market Benchmark Context</h2>
    <div id="benchmark-ribbon" class="benchmark-ribbon"><!-- INDEX_BENCHMARK_RIBBON --></div>
  </section>

  <!-- SECTION 2: STRATEGY BREAKDOWN CARDS (Tradetron-like) -->
  <section id="section-strategy-cards" class="report-section">
    <h2>Strategy Breakdown</h2>
    <div id="strategy-cards-grid">
      <!-- STRATEGY_CARD_1_PLACEHOLDER -->
      <!-- STRATEGY_CARD_2_PLACEHOLDER -->
      <!-- ... -->
    </div>
  </section>

  <!-- SECTION 3: EMBEDDED VISUAL ANALYTICS -->
  <section id="section-analytics" class="report-section">
    <h2>Visual Analytics</h2>
    <div class="analytics-grid">
      <div class="chart-panel">
        <h3>Segment Contribution</h3>
        <!-- EMBEDDED_SEGMENT_CONTRIBUTION_CHART -->
      </div>
      <div class="chart-panel">

        <!-- EMBEDDED_GROSS_CHARGES_NET_CHART -->

      <div class="chart-panel chart-full">

        <!-- OPTIONAL_COST_WATERFALL_CHART -->
      </div>
    </div>
  </section>

  <!-- SECTION 4: DETAILED TRADE & POSITION LOG -->
  <section id="section-trade-log" class="report-section">
    <h2>Detailed Trade &amp; Position Log</h2>
    <div id="trade-log-table">
      <!-- TRADE_LOG_TABLE -->
    </div>
  </section>

  <!-- SECTION 5: CONTRACT NOTE RECONCILIATION -->
  <section id="section-contract-note" class="report-section">

    <div id="charges-reconciliation-table">
      <!-- CHARGES_RECONCILIATION_TABLE -->

      <!-- CHARGE_SOURCE_BADGES -->
    </div>
  </section>

  <!-- SECTION 6: MANDATORY DISCLAIMER FOOTER -->
  <section id="section-disclaimer" class="report-section">
    <div class="disclaimer-footer">
      <strong><!-- DISCLAIMER_TEXT_PLACEHOLDER --></strong>
    </div>
  </section>

</div>
</body>
</html>
